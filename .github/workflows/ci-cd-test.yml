# Team 45 CI-CD test pipeline.
#
# Builds the RESOLVE runtime image (CI-CD/docker/pipeline/Dockerfile), runs the sbom
# action on a known sample SBOM, checks the results, and uploads them.
# This tests the plumbing (action.yml -> start_action.sh -> sbom.py ->
# outputs), not the accuracy of `resolve sbom`.
#
# Note: `resolve sbom` queries NVD live, so a failure here can be caused by
# NVD being slow or rate-limiting, not by our code.

name: CI-CD test

# Manual only for now: run it from the Actions tab ("Run workflow") or with
# `gh workflow run ci-cd-test.yml`. To run automatically later, add:
#   push:
#     paths: ["CI-CD/**", ".github/workflows/ci-cd-test.yml"]
#   pull_request:
#     paths: ["CI-CD/**", ".github/workflows/ci-cd-test.yml"]
#
# llm-provider (chosen in the "Run workflow" form):
#   none    no AI; affected-file/affected-function come back UNKNOWN
#   gemini  `resolve sbom -L gemini`; needs the GEMINI_API_KEY repo secret
#           (v0.1.0 hard-codes gemini-2.5-flash, which Google no longer offers
#           to new users, so this returns UNKNOWN until an upstream fix)
#   ollama  `resolve sbom -L ollama`; starts a local ollama server on the
#           runner and pulls gemma3 (the model v0.1.0 hard-codes). No key,
#           no outside AI service. Those steps only run when ollama is chosen.
on:
  workflow_dispatch:
    inputs:
      llm-provider:
        description: "LLM that fills in affected file/function"
        type: choice
        options: [none, gemini, ollama]
        default: none

permissions:
  contents: read

jobs:
  sbom:
    name: sbom action (sample SBOM, llm ${{ inputs.llm-provider }})
    runs-on: ubuntu-latest
    env:
      IMAGE: resolve-ci:dev
      OUTPUT_DIR: test-results/sbom-c-vuln
      LLM_PROVIDER: ${{ inputs.llm-provider }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build RESOLVE runtime image
        run: >
          docker build
          -f CI-CD/docker/pipeline/Dockerfile
          --build-arg AI_BACKEND=none
          -t "$IMAGE"
          CI-CD

      # --- ollama only -------------------------------------------------------
      # Runs ollama as a second container on this runner. The sbom container
      # reaches it through Docker's bridge gateway (the runner itself, where
      # port 11434 is published), so no extra Docker network is needed.
      - name: Start ollama and pull gemma3
        id: ollama
        if: inputs.llm-provider == 'ollama'
        run: |
          set -euo pipefail
          docker run -d --name ollama -p 11434:11434 ollama/ollama:latest

          # Wait (up to 60s) for the server to answer.
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          curl -sf http://localhost:11434/api/version > /dev/null \
            || { echo "::error::ollama server did not start"; docker logs ollama; exit 1; }

          # gemma3 is the model RESOLVE v0.1.0 asks ollama for (a few GB).
          docker exec ollama ollama pull gemma3

          gateway=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')
          echo "host=http://$gateway:11434" >> "$GITHUB_OUTPUT"
          echo "ollama reachable from containers at http://$gateway:11434"
      # -----------------------------------------------------------------------

      - name: Run sbom action
        id: sbom
        uses: ./CI-CD/actions/sbom
        with:
          image: ${{ env.IMAGE }}
          sbom-path: CI-CD/tests/sample-projects/sbom-c-vuln/sbom.spdx.json
          output-dir: ${{ env.OUTPUT_DIR }}
          llm-provider: ${{ env.LLM_PROVIDER }}
          # Only hand the key over when an LLM that needs it was chosen.
          api-key: ${{ inputs.llm-provider == 'gemini' && secrets.GEMINI_API_KEY || '' }}
          # Empty unless the ollama step ran.
          ollama-host: ${{ steps.ollama.outputs.host }}

      - name: Check results
        env:
          CVE_COUNT: ${{ steps.sbom.outputs.cve-count }}
          VULNS_PATH: ${{ steps.sbom.outputs.vulnerabilities-path }}
        run: |
          set -euo pipefail
          echo "vulnerabilities-path: $VULNS_PATH"
          echo "cve-count:            $CVE_COUNT"

          test -f "$OUTPUT_DIR/vulnerabilities.json" \
            || { echo "::error::$OUTPUT_DIR/vulnerabilities.json was not created"; exit 1; }
          python3 -m json.tool "$OUTPUT_DIR/vulnerabilities.json" > /dev/null \
            || { echo "::error::vulnerabilities.json is not valid JSON"; exit 1; }
          [ "${CVE_COUNT:-0}" -gt 0 ] \
            || { echo "::error::sbom action reported no CVEs"; exit 1; }

          # Expected for this sample, but NVD data is live, so only warn.
          grep -q "CVE-2024-31755" "$OUTPUT_DIR/vulnerabilities.json" \
            || echo "::warning::CVE-2024-31755 not in results (NVD data may have changed)"

          # With an LLM, v0.1.0 doesn't fail on a bad key or a failed call: it
          # just writes UNKNOWN. Warn (not fail; LLM answers vary) if the LLM
          # filled in nothing at all.
          if [ "$LLM_PROVIDER" != "none" ]; then
            python3 - "$OUTPUT_DIR/vulnerabilities.json" <<'EOF'
          import json, sys
          vulns = json.load(open(sys.argv[1]))["vulnerabilities"]
          found = [v for v in vulns if v.get("affected-function", "UNKNOWN") != "UNKNOWN"]
          print(f"LLM filled in affected-function for {len(found)} of {len(vulns)} entries")
          for v in found:
              print(f"  {v['cve-id']}: {v.get('affected-file')}:{v['affected-function']}")
          if not found:
              print("::warning::LLM returned no affected functions (check the key, quota "
                    "and the 'resolve sbom' log for 'Failed to identify')")
          EOF
          fi

      - name: Show ollama server log
        if: always() && inputs.llm-provider == 'ollama'
        run: docker logs ollama || true

      - name: Upload results
        if: always()   # upload even if an earlier step failed
        uses: actions/upload-artifact@v4
        with:
          name: sbom-c-vuln-results-${{ inputs.llm-provider }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
